<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>{{ manifest.scenario.number }}</title>
</head>
<body>
	<a href="/">Back</a>

	<h1>{{ manifest.scenario.title }}</h1>

	<p>{{ manifest.scenario.text }}</p>

	<label for="voice">Voice</label><br>
	<select id="voice">
		{% for v in manifest.clips[0].audio_urls.keys() %}
			<option value="{{ v }}">{{ v }}</option>
		{% endfor %}
	</select>

	<h2>Audio</h2>

	<audio id="player" controls preload="none"></audio>

	<div id="clips">
		{% for clip in manifest.clips %}
            <button
                type="button"
                style="display:block;margin:8px 0"
                data-header="{{ clip.header }}"
                data-audio='{{ clip.audio_urls | tojson }}'
            >
                ▶ {{ clip.header }}
            </button>

		{% endfor %}
	</div>

	<script>
		const player = document.getElementById("player");
		const voiceSelect = document.getElementById("voice");

        function playFromButton(btn) {
        	const voice = voiceSelect.value;
	        const audioMap = JSON.parse(btn.dataset.audio);
	        const url = audioMap[voice];
	        if (!url) return;
	            player.src = url;
	            player.play();

            }

		document.getElementById("clips").addEventListener("click", (e) => {
			if (e.target.tagName === "BUTTON") {
				playFromButton(e.target);
			}
		});
	</script>
</body>
</html>
